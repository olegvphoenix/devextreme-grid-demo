<div class="settings__head">
  <h1>Сохранённые настройки</h1>
  <dx-button
    data-testid="settings-refresh"
    text="Обновить"
    icon="refresh"
    stylingMode="outlined"
    (onClick)="refresh()"
  ></dx-button>
  <dx-button
    data-testid="settings-clear"
    text="Очистить всё"
    icon="trash"
    stylingMode="outlined"
    [disabled]="rows.length === 0"
    (onClick)="clear()"
  ></dx-button>
</div>

<p class="settings__hint">
  Содержимое LocalStorage приложения: ключи с префиксом
  <code>dxgrid-demo:</code> и их значения.
</p>

<p *ngIf="rows.length === 0" class="settings__empty" data-testid="settings-empty">
  Сохранённых настроек нет: откройте основную страницу и измените что-нибудь
  в гриде.
</p>

<div *ngIf="rows.length > 0" class="settings__list" data-testid="settings-table">
  <section
    *ngFor="let row of rows; trackBy: trackByKey"
    class="settings__card"
    data-testid="settings-row"
  >
    <header class="settings__card-head">
      <code class="settings__key" data-testid="settings-key">{{ row.key }}</code>
      <dx-button
        data-testid="settings-remove"
        icon="close"
        hint="Удалить ключ"
        stylingMode="text"
        (onClick)="remove(row.key)"
      ></dx-button>
    </header>
    <pre class="settings__value" data-testid="settings-value">{{ row.value }}</pre>
  </section>
</div>
