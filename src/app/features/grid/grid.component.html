<section class="grid-page__toolbar" data-testid="grid-toolbar">
  <div class="grid-page__group" id="dataset">
    <span class="grid-page__label">Строк</span>
    <dx-select-box
      data-testid="dataset-size"
      [items]="datasetSizes"
      [value]="settings.dataset"
      [displayExpr]="formatDataset"
      [width]="120"
      (onValueChanged)="onDatasetChange($event.value)"
    ></dx-select-box>
  </div>
  <div class="grid-page__group" id="columns">
    <span class="grid-page__label">Колонки</span>
    <dx-radio-group
      data-testid="width-mode"
      [items]="widthModes"
      displayExpr="text"
      valueExpr="value"
      layout="horizontal"
      [value]="settings.widthMode"
      (onValueChanged)="onWidthModeChange($event.value)"
    ></dx-radio-group>
  </div>
  <div class="grid-page__group" id="selection">
    <span class="grid-page__label">Выбор</span>
    <dx-select-box
      data-testid="selection-mode"
      [items]="selectionModes"
      displayExpr="text"
      valueExpr="value"
      [value]="settings.selectionMode"
      [width]="230"
      (onValueChanged)="onSelectionModeChange($event.value)"
    ></dx-select-box>
    <dx-button
      data-testid="copy-selection"
      icon="copy"
      hint="Скопировать выделение для вставки в Excel (Ctrl+C)"
      stylingMode="outlined"
      [disabled]="!copyEnabled"
      (onClick)="onCopy()"
    ></dx-button>
  </div>
  <div class="grid-page__group" id="export">
    <dx-drop-down-button
      data-testid="export-menu"
      text="Экспорт"
      icon="export"
      stylingMode="outlined"
      [dropDownOptions]="menuOptions"
      dropDownContentTemplate="exportMenu"
    >
      <div *dxTemplate="let menu of 'exportMenu'" class="grid-page__menu">
        <dx-button
          data-testid="export-server-xlsx"
          text="Excel (сервер)"
          icon="exportxlsx"
          hint="Все строки под фильтром, файл строит сервер"
          stylingMode="text"
          [disabled]="exportBusy"
          (onClick)="onExport('server', 'xlsx')"
        ></dx-button>
        <dx-button
          data-testid="export-server-pdf"
          text="PDF (сервер)"
          icon="exportpdf"
          hint="Все строки под фильтром, файл строит сервер"
          stylingMode="text"
          [disabled]="exportBusy"
          (onClick)="onExport('server', 'pdf')"
        ></dx-button>
        <dx-button
          data-testid="export-grid-xlsx"
          text="Excel (штатно)"
          icon="exportxlsx"
          hint="exportDataGrid: грид сам загружает все строки в браузер"
          stylingMode="text"
          [disabled]="exportBusy"
          (onClick)="onExport('grid', 'xlsx')"
        ></dx-button>
        <dx-button
          data-testid="export-grid-pdf"
          text="PDF (штатно)"
          icon="exportpdf"
          hint="exportDataGrid: грид сам загружает все строки в браузер"
          stylingMode="text"
          [disabled]="exportBusy"
          (onClick)="onExport('grid', 'pdf')"
        ></dx-button>
      </div>
    </dx-drop-down-button>
    <span
      *ngIf="exporting"
      class="grid-page__export-status"
      role="status"
      data-testid="export-status"
    >
      <dx-load-indicator [height]="20" [width]="20"></dx-load-indicator>
      <span data-testid="export-status-text">{{ exportingText }}</span>
      <dx-button
        *ngIf="exporting.source === 'server'"
        data-testid="export-cancel"
        text="Отмена"
        stylingMode="text"
        (onClick)="onExportCancel()"
      ></dx-button>
    </span>
  </div>
  <div class="grid-page__group" id="loading">
    <dx-drop-down-button
      data-testid="more-menu"
      text="Ещё"
      stylingMode="outlined"
      [dropDownOptions]="menuOptions"
      dropDownContentTemplate="moreMenu"
    >
      <div *dxTemplate="let menu of 'moreMenu'" class="grid-page__menu">
        <dx-check-box
          data-testid="demo-delay"
          text="Задержка ответа"
          [value]="delayEnabled"
          (onValueChanged)="onDelayChange($event.value)"
        ></dx-check-box>
        <dx-check-box
          data-testid="demo-fail"
          text="Ошибка сервера"
          [value]="failEnabled"
          (onValueChanged)="onFailChange($event.value)"
        ></dx-check-box>
        <dx-button
          data-testid="reset-settings"
          text="Сбросить настройки"
          stylingMode="text"
          (onClick)="onReset()"
        ></dx-button>
      </div>
    </dx-drop-down-button>
  </div>
</section>

<app-filter-chips
  id="filters"
  [columns]="filterColumns"
  [state]="filterState"
  (remove)="onFilterRemove($event)"
  (clear)="onFiltersClear()"
></app-filter-chips>

<app-metrics-panel id="metrics"></app-metrics-panel>

<div
  *ngIf="error"
  class="grid-page__error"
  role="alert"
  data-testid="grid-error"
>
  <span data-testid="grid-error-text">{{ error }}</span>
  <dx-button
    data-testid="grid-retry"
    text="Повторить"
    type="default"
    stylingMode="outlined"
    (onClick)="onRetry()"
  ></dx-button>
</div>

<span id="sorting" class="grid-page__anchor"></span>
<span id="templates" class="grid-page__anchor"></span>
<span id="grouping" class="grid-page__anchor"></span>

<div
  id="pagination"
  class="grid-page__grid"
  [class.grid-page__grid--cells]="cellsMode"
  (keydown)="onGridKeyDown($event)"
>
  <dx-data-grid
    data-testid="grid"
    [dataSource]="dataSource"
    [columns]="columns"
    [filterValue]="filterValue"
    [selection]="selection"
    [remoteOperations]="remoteOperations"
    [paging]="paging"
    [pager]="pager"
    [scrolling]="scrolling"
    height="100%"
    [showBorders]="true"
    [rowAlternationEnabled]="true"
    [errorRowEnabled]="false"
    [columnFixing]="columnFixing"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    [columnResizingMode]="columnResizingMode"
    [columnMinWidth]="columnMinWidth"
    [columnChooser]="columnChooser"
    [sorting]="sorting"
    [filterPanel]="filterPanel"
    [headerFilter]="headerFilter"
    [filterRow]="filterRow"
    [loadPanel]="loadPanel"
    [groupPanel]="groupPanel"
    [grouping]="grouping"
    [summary]="summary"
    [stateStoring]="stateStoring"
    [dateSerializationFormat]="dateSerializationFormat"
    (onContentReady)="onContentReady($event)"
    (onOptionChanged)="onOptionChanged($event)"
    (onSelectionChanged)="onSelectionChanged($event)"
    (onCellClick)="onCellClick($event)"
    (onCellPrepared)="onCellPrepared($event)"
  >
    <div *dxTemplate="let header of 'headerCell'" class="grid-header">
      <span class="grid-header__caption">{{ header.column.caption }}</span>
      <button
        type="button"
        class="grid-header__filter"
        [class.grid-header__filter--active]="
          isFilterActive(header.column.dataField)
        "
        [attr.data-testid]="'filter-' + header.column.dataField"
        [attr.aria-label]="'Фильтр: ' + header.column.caption"
        (click)="openFilter(header.column.dataField, $event)"
      >
        <i class="dx-icon dx-icon-filter"></i>
      </button>
    </div>
    <app-status-badge
      *dxTemplate="let cell of 'statusCell'"
      [status]="cell.value"
    ></app-status-badge>
    <app-labels-cell
      *dxTemplate="let cell of 'labelsCell'"
      [id]="cell.row.key"
      [labels]="cell.value"
      (labelsChange)="onLabelsChange(cell.row.key, $event)"
    ></app-labels-cell>
  </dx-data-grid>
</div>

<app-column-filter-popup
  [column]="filterColumn"
  [target]="filterTarget"
  [state]="filterState"
  [(visible)]="filterVisible"
  (apply)="onFilterApply($event)"
></app-column-filter-popup>
