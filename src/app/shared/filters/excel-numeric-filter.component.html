<dx-number-box
  data-testid="numeric-range-from"
  placeholder="с"
  [value]="fromValue"
  [min]="min"
  [max]="max"
  [format]="format ?? ''"
  [showClearButton]="true"
  [showSpinButtons]="false"
  (onValueChanged)="onFromChanged($event)"
></dx-number-box>
<dx-number-box
  data-testid="numeric-range-to"
  placeholder="по"
  [value]="toValue"
  [min]="min"
  [max]="max"
  [format]="format ?? ''"
  [showClearButton]="true"
  [showSpinButtons]="false"
  (onValueChanged)="onToChanged($event)"
></dx-number-box>
